<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyHealth News</title>
  <meta name="description" content="Releases, papers, tutorials and calls for contributions from the PyHealth project.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* ── Hero ── */
    .ph-hero {
      background: linear-gradient(140deg, #1c2b3a 0%, #28425e 60%, #1e3348 100%);
      border-radius: 16px;
      padding: 3rem 2.4rem 2.8rem;
      color: white;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 20px 48px rgba(22,33,31,0.18);
      animation: rise 420ms ease;
    }
    .ph-hero::before {
      content: "";
      position: absolute;
      top: -80px; right: -80px;
      width: 340px; height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,95,38,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .ph-hero::after {
      content: "";
      position: absolute;
      bottom: -100px; left: -60px;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(90,160,230,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .ph-eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(201,95,38,0.9);
      margin: 0 0 0.6rem;
    }
    .ph-hero h1 {
      color: white;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.01em;
    }
    .ph-tagline {
      color: rgba(255,255,255,0.72);
      font-size: 1.05rem;
      line-height: 1.55;
      max-width: 620px;
      margin: 0 0 1.8rem;
    }
    .ph-cta-row {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .ph-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      border-radius: 10px;
      padding: 0.64rem 1.15rem;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: "IBM Plex Sans", sans-serif;
      transition: filter 0.15s, transform 0.1s;
    }
    .ph-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .ph-btn.primary {
      background: var(--accent);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 12px rgba(201,95,38,0.35);
    }
    .ph-btn.outline {
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(6px);
    }

    /* ── Back nav ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.94rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: color 0.12s, background 0.12s, border-color 0.12s;
    }
    .back-link:hover {
      color: var(--accent);
      border-color: var(--line);
      background: var(--paper);
    }

    /* ── Section layout ── */
    .research-section {
      margin-top: 2.5rem;
      animation: rise 500ms ease;
    }
    .section-h2 {
      font-size: clamp(1.3rem, 2.5vw, 1.9rem);
      margin: 0 0 0.35rem;
    }
    .section-sub {
      color: var(--muted);
      font-size: 1rem;
      margin: 0 0 1.4rem;
      line-height: 1.5;
    }

    /* ── Core tenets ── */
    .tenets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.85rem;
    }
    .tenet-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.6rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .tenet-card:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(201,95,38,0.09);
      transform: translateY(-2px);
    }
    .tenet-icon {
      font-size: 1.5rem;
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .tenet-card h3 {
      font-size: 1.05rem;
      margin: 0;
      color: var(--ink);
    }
    .tenet-card p {
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.45;
    }

    /* ── Terms table ── */
    .terms-table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 16px rgba(22,33,31,0.06);
    }
    .terms-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--paper);
      font-size: 0.97rem;
    }
    .terms-table thead tr {
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .terms-table th {
      text-align: left;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 0.85rem 1.4rem;
    }
    .terms-table td {
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .terms-table tbody tr:last-child td { border-bottom: none; }
    .terms-table tbody tr:hover td {
      background: color-mix(in srgb, var(--accent-soft) 30%, transparent);
    }
    .terms-table a { color: var(--accent); text-decoration: none; }
    .terms-table a:hover { text-decoration: underline; }
    .term-name { font-weight: 600; color: var(--ink); }

    /* ── Filter row ── */
    .filter-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      align-items: center;
    }
    .filter-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .filter-pills {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .filter-pill {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      border-radius: 100px;
      padding: 0.3rem 0.85rem;
      font-size: 0.84rem;
      font-weight: 500;
      font-family: "IBM Plex Sans", sans-serif;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
    }
    .filter-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .filter-divider {
      width: 1px;
      height: 18px;
      background: var(--line);
      margin: 0 0.2rem;
    }

    /* ── Paper cards ── */
    .papers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .paper-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.5rem 1.5rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      animation: rise 500ms ease;
    }
    .paper-card:not(.hidden):hover {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(201,95,38,0.1);
      transform: translateY(-2px);
    }
    .paper-card.hidden { display: none; }
    .badge-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.15rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.55rem;
      border-radius: 100px;
      letter-spacing: 0.03em;
    }
    .badge-year {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .badge-venue {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .badge-review {
      background: color-mix(in srgb, #a16207 10%, transparent);
      color: #a16207;
      border: 1px solid color-mix(in srgb, #a16207 25%, transparent);
    }
    .paper-title {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
      margin: 0;
    }
    .paper-authors {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }
    .paper-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 0.5rem;
    }
    .paper-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 500;
      font-family: "IBM Plex Sans", sans-serif;
      border-radius: 8px;
      padding: 0.38rem 0.75rem;
      transition: filter 0.12s, transform 0.1s;
    }
    .paper-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .paper-btn.read {
      background: var(--accent);
      color: white;
      border: 1px solid rgba(201,95,38,0.2);
      box-shadow: 0 2px 8px rgba(201,95,38,0.25);
    }
    .paper-btn.details {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .paper-btn.details:hover { color: var(--accent); border-color: var(--accent); }
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.97rem;
    }

    /* ── Apply steps ── */
    .apply-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .apply-step {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.6rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      animation: rise 560ms ease;
    }
    .apply-step:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(201,95,38,0.09);
      transform: translateY(-2px);
    }
    .step-num {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.1rem;
      opacity: 0.85;
    }
    .apply-step h3 {
      font-size: 1.05rem;
      margin: 0;
      color: var(--ink);
    }
    .apply-step p {
      font-size: 0.92rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.45;
    }
    .apply-step-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      margin-top: auto;
      padding-top: 0.5rem;
    }
    .apply-step-link:hover { text-decoration: underline; }

    /* ── Callout banner ── */
    .apply-callout {
      margin-top: 2rem;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.5rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .apply-callout p {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .apply-callout h3 { margin: 0; font-size: 1.1rem; }
    .callout-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      background: var(--accent);
      color: white;
      border-radius: 10px;
      padding: 0.6rem 1.1rem;
      font-size: 0.93rem;
      font-weight: 500;
      font-family: "IBM Plex Sans", sans-serif;
      white-space: nowrap;
      transition: filter 0.15s, transform 0.1s;
    }
    .callout-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    @media (max-width: 600px) {
      .papers-grid { grid-template-columns: 1fr; }
      .apply-steps { grid-template-columns: 1fr; }
      .tenets-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 380px) {
      .tenets-grid { grid-template-columns: 1fr; }
    }

    .news-list { display: grid; gap: 1rem; margin-top: 1rem; }
    .news-item { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 1.2rem 1.35rem; scroll-margin-top: 5rem; }
    .news-item:target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    .news-meta { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
    .news-tag { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 999px; padding: 0.05rem 0.55rem; font-weight: 600; }
    .news-item h3 { margin: 0.45rem 0 0.4rem; font-size: 1.15rem; color: var(--ink); }
    .news-item p { margin: 0; color: var(--ink); line-height: 1.6; }
    .news-item ul { margin: 0.6rem 0 0; padding-left: 1.15rem; color: var(--ink); line-height: 1.6; font-size: 0.95rem; }
    .news-item code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0.05rem 0.35rem; font-size: 0.86rem; overflow-wrap: anywhere; }
    .news-item code.news-code { display: inline-block; margin-top: 0.7rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86rem; background: #1c2b3a; color: #f3f5f8; border-radius: 8px; padding: 0.4rem 0.75rem; }
    .news-links { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.8rem; }
    .news-links a { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 0.92rem; }
    .news-links a:hover { text-decoration: underline; }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
</head>
<body>

  <header class="site-header">
    <div class="site-wrap header-inner">
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" class="back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          PyHealth
        </a>
      </nav>
      <span style="color: var(--muted); font-size: 0.88rem; font-weight: 500;">News</span>
    </div>
  </header>

  <main class="site-wrap" style="padding: 2.2rem 0 3.5rem;">

    <section class="ph-hero">
      <p class="ph-eyebrow">PyHealth News</p>
      <h1>What's new in PyHealth</h1>
      <p class="ph-tagline">Releases, papers, tutorials and calls for contributions from the PyHealth project.</p>
      <div class="ph-cta-row">
        <a href="https://github.com/sunlabuiuc/PyHealth/releases" class="ph-btn primary" target="_blank" rel="noopener">All releases</a>
        <a href="https://discord.gg/mpb835EHaX" class="ph-btn outline" target="_blank" rel="noopener">Join the Discord</a>
      </div>
    </section>

    <section class="research-section">
      <div class="news-list" id="news-list"><p class="no-results">Loading news…</p></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="site-wrap" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
      <span>Copyright <span id="year"></span> PyHealth Team</span>
      <a href="index.html" style="color:var(--accent); text-decoration:none; font-size:0.9rem;">← Back to PyHealth</a>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const fmt = d => { const [y, m, day] = d.split('-').map(Number); return day ? `${MONTHS[m - 1].slice(0, 3)} ${day}, ${y}` : `${MONTHS[m - 1]} ${y}`; };
    const ext = href => /^https?:/.test(href) ? ' target="_blank" rel="noopener"' : '';
    fetch('data/news.json').then(r => r.json()).then(items => {
      document.getElementById('news-list').innerHTML = items.map(n => `
        <article class="news-item" id="${n.id}">
          <div class="news-meta"><span class="news-tag">${n.tag}</span><time datetime="${n.date}">${fmt(n.date)}</time></div>
          <h3>${n.title}</h3>
          <p>${n.summary}</p>
          ${n.points.length ? `<ul>${n.points.map(p => `<li>${p}</li>`).join('')}</ul>` : ''}
          ${n.code ? `<code class="news-code">${n.code}</code>` : ''}
          <div class="news-links">${n.links.map(([t, h]) => `<a href="${h}"${ext(h)}>${t} →</a>`).join('')}</div>
        </article>`).join('');
      if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
    }).catch(() => { document.getElementById('news-list').innerHTML = '<p class="no-results">Could not load the news.</p>'; });
  </script>
</body>
</html>
