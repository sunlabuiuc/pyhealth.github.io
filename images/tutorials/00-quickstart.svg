<circle cx="77" cy="262" r="15" fill="#E5F4F1"/>
<text x="77" y="268" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#007F7A">1</text>
<text x="68" y="307" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#007F7A">Load</text>
<text x="68" y="343" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">MIMIC3Dataset</text>
<text x="68" y="374" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">Patients + events</text>
