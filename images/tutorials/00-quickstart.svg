<text x="942" y="493" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#B76718">How to read the scores</text>
<text x="942" y="524" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#526977">ROC-AUC: ranking of positive and</text>
<text x="942" y="556" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#526977">negative cases.</text>
<text x="942" y="588" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#526977">PR-AUC: compare with the test set’s</text>
<text x="942" y="620" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#526977">positive rate.</text>
