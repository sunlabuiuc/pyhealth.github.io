<text x="696.5" y="551" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#B76718">Admission t+1: outcome</text>
<line x1="403" y1="545" x2="512" y2="545" stroke="#526977" stroke-width="2.5"/>
<polygon points="512,545 502.3465918192059,550.2736809246462 502.3465918192059,539.7263190753538" fill="#526977"/>
<text x="76" y="603" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">Diagnoses • procedures • drugs</text>
<text x="529" y="603" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">mortality = 0 or 1</text>
<text x="529" y="634" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">Last admission has no future</text>
<text x="529" y="665" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">label.</text>
<rect x="918" y="453" width="474" height="228" rx="18" fill="white" stroke="#D7E2E8" stroke-width="1.5"/>
