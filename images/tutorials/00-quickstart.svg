<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">From patient records to a prediction</title><desc id="desc">The notebook follows five steps on synthetic MIMIC-III data. One patient stays in one split. The label comes from that patient’s next admission.</desc>
<rect x="0" y="0" width="1440" height="940" rx="0" fill="#F5F8FA"/>
<rect x="0" y="0" width="12" height="940" rx="0" fill="#007F7A"/>
<text x="48" y="49" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#132B3A">PyHealth</text>
<text x="1392" y="47" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#007F7A">TUTORIAL 00</text>
<text x="48" y="116" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#132B3A">From patient records to a prediction</text>
<text x="48" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#526977">The notebook follows five steps on synthetic MIMIC-III data.</text>
