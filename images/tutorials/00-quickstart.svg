<text x="70" y="741" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#2864C5">SPLIT BEFORE FITTING</text>
<text x="70" y="772" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#132B3A">set_task(task, split=PatientSplit(...)) learns the code vocabulary from training patients only.</text>
