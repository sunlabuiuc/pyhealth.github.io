<rect x="48" y="453" width="6" height="228" rx="3" fill="#007F7A"/>
<text x="72" y="493" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#007F7A">What is one sample?</text>
