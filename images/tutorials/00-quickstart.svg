<text x="890" y="374" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">Validate each epoch</text>
<line x1="1120" y1="327" x2="1140" y2="327" stroke="#526977" stroke-width="2.5"/>
<polygon points="1140,327 1130.346591819206,332.2736809246462 1130.346591819206,321.7263190753538" fill="#526977"/>
