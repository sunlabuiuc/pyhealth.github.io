<text x="1184.0" y="463" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7553B7">p1: visits a + b</text>
<text x="1000" y="538" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#526977">Whole patients, with replacement.</text>
<text x="1000" y="570" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#526977">Use the same resample for both</text>
<text x="1000" y="602" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#526977">models.</text>
