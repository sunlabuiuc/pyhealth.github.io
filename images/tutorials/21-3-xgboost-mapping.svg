<title id="title">Strong baselines and explicit code representations</title><desc id="desc">XGBoost uses code counts; CrossMap translates vocabularies; nested_multihot marks code presence per visit. Choose the representation deliberately: counts retain repeats; multi-hot records presence.</desc>
