<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">Let agents search; keep only the gains that hold up</title><desc id="desc">AutoImprove proposes models and settings, then selects, tests and explains like a careful analyst. Search: baseline, agents propose, checked against the search space, scored by patient-grouped cross-validation. Select: candidates must beat the baseline fold by fold; the simplest model within one standard error wins; attribution measures each change. Prove: test once with a paired interval, a report labels every statement by its evidence, and a null-label control checks the search does not improve on noise.</desc>
<rect x="0" y="0" width="1440" height="940" rx="0" fill="#F5F8FA"/>
<rect x="0" y="0" width="12" height="940" rx="0" fill="#7553B7"/>
<text x="48" y="49" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#132B3A">PyHealth</text>
<text x="1392" y="47" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#7553B7">TUTORIAL 09</text>
<text x="48" y="116" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#132B3A">Let agents search; keep only the gains that hold up</text>
<text x="48" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#526977">AutoImprove proposes models and settings, then selects, tests and explains like a careful analyst.</text>
