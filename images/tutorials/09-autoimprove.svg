<polygon points="400,317 390,322.5 390,311.5" fill="#007F7A"/>
<rect x="404" y="291" width="298" height="52" rx="10" fill="#E5F4F1"/>
<text x="554" y="325" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#007F7A">Agents propose</text>
<line x1="707" y1="317" x2="725" y2="317" stroke="#007F7A" stroke-width="2.5"/>
<polygon points="733,317 723,322.5 723,311.5" fill="#007F7A"/>
<rect x="737" y="291" width="298" height="52" rx="10" fill="#E5F4F1"/>
<text x="886" y="325" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#007F7A">Checked vs. space</text>
<line x1="1040" y1="317" x2="1058" y2="317" stroke="#007F7A" stroke-width="2.5"/>
<polygon points="1066,317 1056,322.5 1056,311.5" fill="#007F7A"/>
<rect x="1070" y="291" width="298" height="52" rx="10" fill="#E5F4F1"/>
<text x="1219" y="325" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#007F7A">Patient-grouped CV</text>
<text x="72" y="381" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526977">An LLM or random search proposes a model and settings: data, never code.</text>
<rect x="48" y="425" width="1344" height="186" rx="18" fill="white" stroke="#D7E2E8" stroke-width="1.5"/>
<rect x="48" y="425" width="6" height="186" rx="3" fill="#7553B7"/>
<text x="72" y="465" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#7553B7">2  Select</text>
<rect x="72" y="491" width="409" height="52" rx="10" fill="#F1ECFA"/>
<text x="277" y="525" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7553B7">Beat baseline fold by fold</text>
<line x1="485" y1="517" x2="503" y2="517" stroke="#7553B7" stroke-width="2.5"/>
<polygon points="511,517 501,522.5 501,511.5" fill="#7553B7"/>
<rect x="515" y="491" width="409" height="52" rx="10" fill="#F1ECFA"/>
<text x="720" y="525" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7553B7">Simplest within 1 SE</text>
<line x1="929" y1="517" x2="947" y2="517" stroke="#7553B7" stroke-width="2.5"/>
<polygon points="955,517 945,522.5 945,511.5" fill="#7553B7"/>
<rect x="959" y="491" width="409" height="52" rx="10" fill="#F1ECFA"/>
<text x="1163" y="525" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7553B7">What each change adds</text>
<text x="72" y="581" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526977">A gain counts only if it is consistent across folds; ties go to the more interpretable model.</text>
<rect x="48" y="625" width="1344" height="186" rx="18" fill="white" stroke="#D7E2E8" stroke-width="1.5"/>
<rect x="48" y="625" width="6" height="186" rx="3" fill="#B4531F"/>
<text x="72" y="665" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#B4531F">3  Prove</text>
<rect x="72" y="691" width="409" height="52" rx="10" fill="#FBEDE4"/>
<text x="277" y="725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#B4531F">Test once, paired CI</text>
<line x1="485" y1="717" x2="503" y2="717" stroke="#B4531F" stroke-width="2.5"/>
<polygon points="511,717 501,722.5 501,711.5" fill="#B4531F"/>
<rect x="515" y="691" width="409" height="52" rx="10" fill="#FBEDE4"/>
<text x="720" y="725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#B4531F">Report: measured / tested</text>
<line x1="929" y1="717" x2="947" y2="717" stroke="#B4531F" stroke-width="2.5"/>
<polygon points="955,717 945,722.5 945,711.5" fill="#B4531F"/>
<rect x="959" y="691" width="409" height="52" rx="10" fill="#FBEDE4"/>
<text x="1163" y="725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#B4531F">Null-label control</text>
<text x="72" y="781" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526977">The test split is used once; a coin-flip label should find no improvement.</text>
<rect x="48" y="823" width="1344" height="66" rx="14" fill="#F1ECFA"/>
<text x="68" y="862" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#7553B7">Every trial is logged with its hypothesis, written before it ran; the report says what paid off.</text>
<text x="48" y="920" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#526977">PYHEALTH  /  COLAB VISUAL GUIDE</text>
<text x="1392" y="920" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#526977">Concepts only • the measured results are in the notebook</text>
</svg>
