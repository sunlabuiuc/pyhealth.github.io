<text x="478" y="270" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#2864C5">One sample = inputs + label</text>
<text x="478" y="306" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">Keep patient_id with each sample so all of a patient’s admissions can stay together.</text>
