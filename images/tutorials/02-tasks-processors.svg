<text x="68" y="270" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#007F7A">Patient timeline</text>
<text x="68" y="306" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#526977">Task.__call__(patient)</text>
