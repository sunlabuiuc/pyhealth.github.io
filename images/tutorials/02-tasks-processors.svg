<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">Turn a clinical question into tensors</title><desc id="desc">A task maps one patient to zero or more samples. A schema chooses a processor for each field. Define the sample and prediction time first; then choose how each field is encoded.</desc>
