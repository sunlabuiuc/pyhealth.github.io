<title id="title">Split patients before fitting the vocabulary</title><desc id="desc">PyHealth 2.1 lets set_task split first, then reuse the training-fitted processors for every part. Keep patients together and fit preprocessing on train; fix seeds for repeatable experiments.</desc>
